spring.application.name=bodegas-marcela

# --- Base de datos (variables de entorno requeridas en Render) ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari no necesita config SSL extra; el driver lee sslmode directamente de la URL
spring.datasource.hikari.auto-commit=true

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Servidor ---
# Render inyecta la variable PORT; 8080 es el fallback local
server.port=${PORT:8080}

# --- CORS (ver CorsConfig.java) ---
# En desarrollo: dejar vacío o no definir la variable CORS_ALLOWED_ORIGINS
# En producción: CORS_ALLOWED_ORIGINS=http://localhost:4200,https://tu-app.vercel.app
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://bodegas-marcela-frontend.vercel.app}
